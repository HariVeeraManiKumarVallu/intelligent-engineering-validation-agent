[project]
name = "intelligent-engineering-validation-agent"
version = "0.1.0"
description = "Hybrid C++/Python agentic AI workflow for engineering validation"
readme = "README.md"
authors = [
    { email = "manikumarvallu@gmail.com" }
]
requires-python = ">=3.11"

dependencies = [
    "langchain>=1.3.15",
    "langchain-google-genai>=4.3.4",
    "langchain-openai>=1.5.2",
    "langgraph>=1.2.11",
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "openai>=3.3.0",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.0",
    "torch>=2.13.0",
]

[project.scripts]
intelligent-engineering-validation-agent = "intelligent_engineering_validation_agent:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"